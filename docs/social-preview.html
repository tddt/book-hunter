<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:640px;overflow:hidden}
body{background:#14171e;color:#f5f1e8;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;position:relative}
.glow{position:absolute;width:900px;height:900px;right:-260px;top:-420px;border-radius:50%;background:radial-gradient(circle,rgba(180,72,47,.26),rgba(180,72,47,0) 66%)}
.glow2{position:absolute;width:620px;height:620px;left:-300px;bottom:-420px;border-radius:50%;background:radial-gradient(circle,rgba(168,132,63,.15),rgba(0,0,0,0) 68%)}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.045) .7px,transparent .7px);background-size:6px 6px}
.left{position:absolute;left:72px;top:0;width:560px;height:640px;z-index:2}
.left>*{position:absolute;left:0}
.seal{top:62px;width:46px;height:46px;border-radius:9px;background:#b4482f;display:grid;place-items:center;font-size:26px;font-family:serif;box-shadow:0 8px 26px rgba(180,72,47,.4)}
h1{top:130px;font-size:70px;line-height:1;font-weight:800;letter-spacing:-.04em;white-space:nowrap}
h1 .dot{color:#b4482f;font-size:44px;vertical-align:8px;margin:0 8px}
h1 .en{font-size:35px;font-weight:400;color:#c9ccd3;letter-spacing:.01em;vertical-align:7px}
.sub{top:224px;font-size:15px;letter-spacing:.24em;color:#8f949e;text-transform:uppercase}
.rule{top:266px;width:52px;height:3px;background:#b4482f;border-radius:2px}
.tag{top:294px;font-size:28px;letter-spacing:.02em;font-weight:600;color:#eae6dc;line-height:1.4}
.tag b{color:#e8a58c;font-weight:600}
.desc{top:352px;font-size:15.5px;color:#9da2ac;line-height:1.85}
.chips{top:440px;display:flex;gap:8px}
.chip{font-family:Consolas,monospace;font-size:12.5px;color:#c3c7ce;border:1px solid rgba(255,255,255,.17);border-radius:6px;padding:5px 10px;background:rgba(255,255,255,.03)}
.stack{top:500px;font-size:13.5px;color:#858a94;letter-spacing:.05em}
.stack b{color:#c9ccd3;font-weight:600}
.right{position:absolute;right:-30px;top:62px;width:640px;transform:perspective(1600px) rotateY(-8deg) rotateX(1deg);z-index:1}
.frame{border-radius:11px;overflow:hidden;border:1px solid rgba(255,255,255,.11);box-shadow:0 40px 100px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03);background:#20242d}
.bar{height:32px;background:#282d37;display:flex;align-items:center;gap:7px;padding:0 13px}
.bar i{width:9px;height:9px;border-radius:50%;background:#4a505c}
.bar i:first-child{background:#c06a54}.bar i:nth-child(2){background:#b79a55}.bar i:nth-child(3){background:#5e8a70}
.bar span{margin-left:9px;font-size:11px;color:#8a909b}
.frame img{width:100%;height:452px;object-fit:cover;object-position:top left;display:block}
</style></head><body>
<div class="glow"></div><div class="glow2"></div><div class="grid"></div>
<div class="left">
  <div class="seal">猎</div>
  <h1>书猎<span class="dot">·</span><span class="en">Book Hunter</span></h1>
  <div class="sub">LOCAL-FIRST EBOOK LIBRARY &amp; READER</div>
  <div class="rule"></div>
  <div class="tag">搜得到、导得进、<b>读得舒服</b></div>
  <div class="desc">五种格式统一入库，共用自研排版引擎、全文检索与正文内对照翻译。<br>书和笔记都留在自己的磁盘上，不需要账号。</div>
  <div class="chips"><span class="chip">EPUB</span><span class="chip">MOBI</span><span class="chip">AZW3</span><span class="chip">PDF</span><span class="chip">TXT</span><span class="chip">MIT</span></div>
  <div class="stack">ELECTRON 33 / VUE 3 / TYPESCRIPT　·　<b>github.com/tddt/book-hunter</b></div>
</div>
<div class="right"><div class="frame"><div class="bar"><i></i><i></i><i></i><span>书猎 · 我的书架</span></div><img src="screenshots/shelf-dark.jpg" alt=""></div></div>
</body></html>
